<style>
/* Layout: one column of numbered steps; sticky bar (title, language, copy, reset); results as code tables */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#17201c; --muted:#5b6862; --line:#d3dbd7;
  --accent:#0f766e; --accent-fg:#ffffff; --chip:#e5f0ed;
  --ok:#15803d; --ok-bg:#e8f6ec; --warn:#a16207; --warn-bg:#fdf5e1; --bad:#b91c1c; --bad-bg:#fdeaea;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715; --panel:#18201d; --fg:#e2e9e6; --muted:#97a69f; --line:#2c3833;
  --accent:#2dd4bf; --accent-fg:#06201c; --chip:#173029;
  --ok:#4ade80; --ok-bg:#12291b; --warn:#facc15; --warn-bg:#2a2410; --bad:#f87171; --bad-bg:#2e1515; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-size:1.05rem;margin:0;flex:1 1 auto;min-width:0}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--display);font-size:1.05rem;margin:0;display:flex;gap:10px;align-items:center}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-family:var(--mono);font-size:.85rem;flex:none}
p{margin:0;max-width:68ch}
.muted{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px}
label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);direction:ltr}
[dir=rtl] input[type=number]{text-align:right}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-size:.9rem;border-radius:6px;padding:7px 12px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
code{font-family:var(--mono);font-size:.85em;direction:ltr;unicode-bidi:isolate;background:var(--chip);padding:1px 6px;border-radius:4px;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:start;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:.78rem;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.v{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-weight:600}
tr.key td{background:var(--chip)}
.msg{border-radius:6px;padding:10px 12px;border-inline-start:4px solid var(--line);background:var(--bg)}
.msg.ok{border-color:var(--ok);background:var(--ok-bg)}
.msg.warn{border-color:var(--warn);background:var(--warn-bg)}
.msg.bad{border-color:var(--bad);background:var(--bad-bg)}
.msgs{display:flex;flex-direction:column;gap:6px}
.kv{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.92rem}
.kv b{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
ul{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px}
textarea{font-family:var(--mono);font-size:.82rem;width:100%;min-height:220px;direction:ltr;text-align:left;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px}
.toast{font-size:.85rem;color:var(--ok)}
.foot{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <h1 data-t="title"></h1>
  <button id="langBtn" class="ghost" type="button"></button>
  <button id="copyBtn" type="button" data-t="copy"></button>
  <button id="resetBtn" class="ghost" type="button" data-t="reset"></button>
  <span id="toast" class="toast" role="status"></span>
</div></div>

<main class="wrap">
  <p class="muted" data-t="intro" data-html></p>

  <section class="card">
    <h2><span class="num">1</span><span data-t="s1"></span></h2>
    <div class="grid">
      <label><span data-t="site"></span><input id="site" type="text"></label>
      <label><span data-t="model"></span>
        <select id="model">
          <option value="LC1K">LC1K · 1 kg</option>
          <option value="LC1KD">LC1K Dual · 1 kg</option>
          <option value="LC8K">LC8K · 8 kg</option>
          <option value="LC8KD" selected>LC8K Dual · 8 kg</option>
          <option value="LC16K">LC16K · 16 kg</option>
          <option value="LC16KD">LC16K Dual · 16 kg</option>
        </select></label>
      <label><span data-t="peak"></span><input id="peak" type="number" min="0" step="1"></label>
    </div>
    <div id="capMsg" class="msgs"></div>
  </section>

  <section class="card">
    <h2><span class="num">2</span><span data-t="s2"></span></h2>
    <div class="grid">
      <label><span data-t="mat"></span>
        <select id="mat">
          <option value="cs" data-t="mat_cs"></option>
          <option value="ss" data-t="mat_ss"></option>
          <option value="hdpe" data-t="mat_hdpe" selected></option>
          <option value="ppr" data-t="mat_ppr"></option>
          <option value="pvc" data-t="mat_pvc"></option>
          <option value="cu" data-t="mat_cu"></option>
          <option value="di" data-t="mat_di"></option>
        </select></label>
      <label><span data-t="circ"></span><input id="circ" type="number" min="0" step="0.1"></label>
      <label id="schL"><span>Schedule</span>
        <select id="sch"><option value="10">Sch 10 / 10S</option><option value="40" selected>Sch 40 / 40S</option><option value="80">Sch 80</option></select></label>
      <label id="pnL"><span>PN (PE100)</span>
        <select id="pn"><option value="21">PN8 · SDR21</option><option value="17">PN10 · SDR17</option><option value="13.6">PN12.5 · SDR13.6</option><option value="11" selected>PN16 · SDR11</option><option value="9">PN20 · SDR9</option><option value="7.4">PN25 · SDR7.4</option></select></label>
      <label id="sdrL"><span>SDR (PP-R)</span>
        <select id="sdr"><option value="11">SDR11</option><option value="7.4" selected>SDR7.4</option><option value="6">SDR6</option></select></label>
    </div>
    <div id="sizeMsg" class="msgs"></div>
    <div class="grid">
      <label><span data-t="od"></span><input id="od" type="number" min="0" step="0.1"></label>
      <label><span data-t="wall"></span><input id="wall" type="number" min="0" step="0.01"></label>
    </div>
    <p class="muted" data-t="pipeNote"></p>
    <div id="pipeInfo" class="kv"></div>
  </section>

  <section class="card">
    <h2><span class="num">3</span><span data-t="s3"></span></h2>
    <p class="muted" data-t="s3note" data-html></p>
    <div class="tbl"><table><thead><tr><th data-t="thMenu"></th><th data-t="thVal"></th><th data-t="thWhy"></th></tr></thead><tbody id="fmRows"></tbody></table></div>
  </section>

  <section class="card">
    <h2><span class="num">4</span><span data-t="s4"></span></h2>
    <div class="tbl"><table><thead><tr><th data-t="thSet"></th><th data-t="thVal"></th><th data-t="thWhy"></th></tr></thead><tbody id="ctRows"></tbody></table></div>
    <p class="muted" data-t="s4note" data-html></p>
  </section>

  <section class="card">
    <h2><span class="num">5</span><span data-t="s5"></span></h2>
    <div class="grid">
      <label><span>M90 · UP</span><input id="up" type="number" step="0.1"></label>
      <label><span>M90 · DN</span><input id="dn" type="number" step="0.1"></label>
      <label><span>M90 · Q</span><input id="q" type="number" step="1"></label>
      <label><span>M91 · Tom/Tos %</span><input id="m91" type="number" step="0.001"></label>
    </div>
    <div id="sigMsg" class="msgs"></div>
    <div class="grid">
      <label><span data-t="flowNow"></span><input id="flowNow" type="number" step="0.1"></label>
      <label><span data-t="tfrNow"></span><input id="tfrNow" type="number" step="1"></label>
      <label><span>Channel 1 (A)</span><input id="ch1" type="number" step="0.1"></label>
      <label><span>Channel 2 (A)</span><input id="ch2" type="number" step="0.1"></label>
    </div>
    <div id="tfrMsg" class="msgs"></div>
  </section>

  <section class="card">
    <h2><span class="num">6</span><span data-t="s6"></span></h2>
    <p class="muted" data-t="s6note"></p>
    <div class="grid">
      <label><span data-t="cuBg"></span><input id="cuBg" type="number" step="0.01" min="0"></label>
      <label><span data-t="cu1"></span><input id="cu1" type="number" step="0.01" min="0"></label>
      <label><span data-t="cu2"></span><input id="cu2" type="number" step="0.01" min="0"></label>
      <label><span data-t="cuT"></span><input id="cuT" type="number" step="0.01" min="0" value="0.2"></label>
      <label><span data-t="tfrSet"></span><input id="tfrSet" type="number" step="1" min="1"></label>
    </div>
    <div id="cuMsg" class="msgs"></div>
  </section>

  <section class="card">
    <h2><span class="num">7</span><span data-t="s7"></span></h2>
    <p class="muted" data-t="s7note"></p>
    <textarea id="summary" readonly aria-label="summary"></textarea>
  </section>

  <section class="card">
    <h2><span class="num">8</span><span data-t="s8"></span></h2>
    <ul data-t="lessons" data-html></ul>
  </section>
  <p class="foot">Cu/Ag Commissioning · v2026.11.13.1</p>
</main>

<script id="calc">
// Pure calculation layer. Every text goes through t(key, vars) so both languages share one logic.
var CALC=(function(){
  var STEEL=[['1/2"',21.3,2.11,2.77,3.73],['3/4"',26.7,2.11,2.87,3.91],['1"',33.4,2.77,3.38,4.55],['1-1/4"',42.2,2.77,3.56,4.85],
    ['1-1/2"',48.3,2.77,3.68,5.08],['2"',60.3,2.77,3.91,5.54],['2-1/2"',73.0,3.05,5.16,7.01],['3"',88.9,3.05,5.49,7.62],
    ['4"',114.3,3.05,6.02,8.56],['5"',141.3,3.40,6.55,9.53],['6"',168.3,3.40,7.11,10.97],['8"',219.1,3.76,8.18,12.70],
    ['10"',273.0,4.19,9.27,15.09],['12"',323.8,4.57,10.31,17.48],['14"',355.6,4.78,11.13,19.05],['16"',406.4,4.78,12.70,21.44]];
  var PE_OD=[20,25,32,40,50,63,75,90,110,125,140,160,180,200,225,250,280,315,355,400,450,500,560,630];
  var PE_WALL={'280|11':25.4}; // ISO 4427 table values where OD/SDR rounding differs
  var PPR_OD=[20,25,32,40,50,63,75,90,110,125,160];
  var PVC_OD=[20,25,32,40,50,63,75,90,110,125,140,160,200,225,250,315];
  var CU_OD=[15,22,28,35,42,54,67,76.1,108];
  var MODELS={LC1K:210,LC1KD:420,LC8K:900,LC8KD:1800,LC16K:2400,LC16KD:4800}; // L/min, CSI manual (l/s x 60)
  var M14={cs:'0. Carbon Steel',ss:'1. Stainless Steel',di:'3. Ductile Iron',cu:'4. Copper',pvc:'5. PVC',hdpe:'9. Other',ppr:'9. Other'};
  var SOUND={hdpe:2400,ppr:2600};
  function nearest(list,v){var b=list[0];list.forEach(function(x){if(Math.abs(x-v)<Math.abs(b-v))b=x;});return b;}
  function r1(x){return Math.round(x*10)/10;}

  function sizeFromCirc(mat,circCm,opt){
    if(!(circCm>0))return null;
    var od=circCm*10/Math.PI,res;
    if(mat==='cs'||mat==='ss'){var row=STEEL[0];STEEL.forEach(function(r){if(Math.abs(r[1]-od)<Math.abs(row[1]-od))row=r;});
      res={od:row[1],wall:row[{'10':2,'40':3,'80':4}[opt.sch]||3],label:row[0]+' Sch '+opt.sch};}
    else if(mat==='hdpe'){var o=nearest(PE_OD,od);res={od:o,wall:PE_WALL[o+'|'+opt.pn]||r1(o/opt.pn),label:'PE100 '+o+' SDR'+opt.pn};}
    else if(mat==='ppr'){var p=nearest(PPR_OD,od);res={od:p,wall:r1(p/opt.sdr),label:'PP-R '+p+' SDR'+opt.sdr};}
    else if(mat==='pvc')res={od:nearest(PVC_OD,od),wall:null,label:'PVC'};
    else if(mat==='cu')res={od:nearest(CU_OD,od),wall:null,label:'Copper'};
    else res={od:r1(od),wall:null,label:''};
    res.measured=r1(od);res.diffPct=Math.abs(res.od-od)/res.od*100;return res;
  }
  function freqScale(peak){
    var need=Math.max(peak||0,1)*1.2,opts=[10,20,50];
    for(var i=0;i<opts.length;i++)if(opts[i]*60>=need)return {fmax:opts[i],m69:opts[i]*60,k:1};
    var m69=Math.ceil(need/500)*500;return {fmax:50,m69:m69,k:m69/3000};
  }
  function flowmeter(s,t){
    var id=s.od-2*s.wall,perMs=Math.PI*Math.pow(id/1000,2)/4*60000,fs=freqScale(s.peak);
    var plastic=s.mat==='hdpe'||s.mat==='ppr'||s.mat==='pvc',z=s.od>300||(plastic&&s.wall>20);
    var tr=id<50?['TS-2',t('tr_s')]:id<=100?[t('trAlt'),t('tr_m')]:id<=700?['TM-1',t('tr_t')]:['TL-1',t('tr_l')];
    var rows=[['M11',r1(s.od),t('r_m11')],['M12',s.wall,t('r_m12',{id:r1(id)})],['M14',M14[s.mat],SOUND[s.mat]?t('r_m14o'):t('r_m14s')]];
    if(SOUND[s.mat])rows.push(['M15',SOUND[s.mat],t('r_m15')]);
    rows=rows.concat([['M16','0. None',t('r_m16')],['M20','0. Water',t('r_m20')],['M23',tr[0],tr[1]],
      ['M24',z?t('m24z_v'):'V',z?t('m24z'):t('m24v')],['M25',t('m25_v'),t('m25')],
      ['M30','Metric',''],['M31','L/min',t('m31')],['M32','Liter',''],['M33','3. x1',t('m33')],
      ['M34 / M35 / M36','On / On / Off',t('m34')],['M40','5',t('m40')],['M41','0.03',t('m41')],
      ['M78','24. Flow Rate Pulse',t('m78'),1],['M67','0 – '+fs.fmax+' Hz',t('m67'),1],['M68','0',t('m68'),1],
      ['M69',fs.m69,t('m69',{f:fs.fmax,m:fs.m69,k:fs.k}),1],
      ['M79',t('m79_v'),t('m79')],['M73 / M74','-99999 / 20',t('m73')],['M42','Set Zero',t('m42')],['M26','ENT',t('m26')]]);
    return {id:id,perMs:perMs,fs:fs,rows:rows};
  }
  function controller(peak,fs,t){
    var peakT=peak>0?Math.round(peak/fs.k):null,start=peakT?Math.round(peakT*1.5):null;
    return {start:start,rows:[['Minimum Current','0.0 A',t('ct_min')],
      ['TFR at Max Flow',start||t('ct_tfr_v'),t('ct_tfr',{p:peakT||'—'}),1],
      [t('ct_exp'),t('ct_exp_v',{k:fs.k}),t('ct_exp_w')]]};
  }
  function signal(up,dn,q,m91,t){
    var out=[];
    if(up>0||dn>0){var lo=Math.min(up||0,dn||0);out.push(lo>=60?['ok',t('sigOk',{v:lo})]:['bad',t('sigBad',{v:lo})]);}
    if(q>0)out.push(q>=80?['ok',t('qOk',{v:q})]:['warn',t('qWarn')]);
    if(m91>0){if(m91>=97&&m91<=103)out.push(['ok',t('m91Ok',{v:m91})]);
      else if(m91>=95&&m91<=105)out.push(['warn',t('m91Warn',{v:m91})]);
      else out.push(['bad',t(m91<97?'m91Low':'m91High',{v:m91})]);}
    return out;
  }
  function tfrCheck(flow,tfr,k,t){
    if(!(flow>0)||tfr===null||!(tfr>=0))return null;
    if(tfr===0)return ['bad',t('tfrZero')];
    var e=flow/k,r=tfr/e,stuck=[150,300,600].some(function(x){return Math.abs(tfr-x)<=x*0.02;});
    if(Math.abs(r-1)<=0.25)return ['ok',t('tfrOk',{e:Math.round(e)})];
    if(stuck)return ['bad',t('tfrStuck',{t:tfr})];
    return ['warn',t('tfrOff',{e:Math.round(e),t:tfr})];
  }
  function copper(bg,c1,c2,target,set,t){
    var vals=[c1,c2].filter(function(x){return x>0;});
    if(!vals.length||!(target>0))return null;
    var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length,added=avg-(bg||0);
    if(added<=0)return {cls:'bad',text:t('cuNone')};
    var ratio=added/target,res={avg:avg,added:added},a=added.toFixed(2);
    if(Math.abs(ratio-1)<=0.25){res.cls='ok';res.text=t('cuOk',{a:a});return res;}
    res.cls='warn';
    if(!(set>0)){res.text=t('cuNeedSet',{a:a});return res;}
    var next=set*ratio,lo=set*0.7,hi=set*1.3,n=Math.round(Math.min(hi,Math.max(lo,next)));
    res.next=n;res.text=t(ratio<1?'cuLow':'cuHigh',{a:a,s:set,n:n})+((next<lo||next>hi)?t('cuCap'):'');
    return res;
  }
  return {sizeFromCirc:sizeFromCirc,freqScale:freqScale,flowmeter:flowmeter,controller:controller,signal:signal,tfrCheck:tfrCheck,copper:copper,MODELS:MODELS,r1:r1};
})();
if(typeof module!=='undefined')module.exports=CALC;
</script>

<script>
// UI layer: language, inputs, render, per-device draft.
(function(){
  var KEY='cuag_comm_v1',LKEY='cuag_lang',$=function(id){return document.getElementById(id);};
  var FIELDS=['site','model','peak','mat','circ','sch','pn','sdr','od','wall','up','dn','q','m91','flowNow','tfrNow','ch1','ch2','cuBg','cu1','cu2','cuT','tfrSet'];
  var manual={od:false,wall:false},lang='ar';
  var saved=null;try{saved=localStorage.getItem(LKEY);}catch(e){}
  lang=saved||((navigator.language||'').slice(0,2)==='en'?'en':'ar');
  if(!I18N[lang])lang='ar';
  function t(k,v){var s=(I18N[lang][k]!=null?I18N[lang][k]:I18N.ar[k])||k;if(v)Object.keys(v).forEach(function(n){s=s.split('{'+n+'}').join(v[n]);});return s;}
  function num(id){var x=parseFloat($(id).value);return isNaN(x)?null:x;}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function msg(el,items){el.innerHTML=items.map(function(m){return '<div class="msg '+m[0]+'">'+esc(m[1])+'</div>';}).join('');}
  function rowsHtml(rows){return rows.map(function(r){return '<tr'+(r[3]?' class="key"':'')+'><td class="v">'+esc(r[0])+'</td><td class="v">'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>';}).join('');}
  function save(){try{var d={};FIELDS.forEach(function(f){d[f]=$(f).value;});d._m=manual;localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;FIELDS.forEach(function(f){if(d[f]!==undefined)$(f).value=d[f];});if(d._m)manual=d._m;}catch(e){}}

  function applyLang(){
    document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
    document.title=t('title');
    document.querySelectorAll('[data-t]').forEach(function(el){var v=t(el.getAttribute('data-t'));if(el.hasAttribute('data-html'))el.innerHTML=v;else el.textContent=v;});
    $('langBtn').textContent=t('langBtn');
    render();
  }

  function render(){
    var mat=$('mat').value;
    $('schL').hidden=!(mat==='cs'||mat==='ss');$('pnL').hidden=mat!=='hdpe';$('sdrL').hidden=mat!=='ppr';
    var sz=CALC.sizeFromCirc(mat,num('circ'),{sch:$('sch').value,pn:parseFloat($('pn').value),sdr:parseFloat($('sdr').value)});
    if(sz){
      if(!manual.od)$('od').value=sz.od;
      if(!manual.wall&&sz.wall!=null)$('wall').value=sz.wall;
      var far=sz.diffPct>3,m=[[far?'warn':'ok',t('size',{m:sz.measured,od:sz.od,lbl:sz.label?' ('+sz.label+')':''})+(far?t('sizeFar',{d:sz.diffPct.toFixed(1)}):'')]];
      if(sz.wall==null&&!manual.wall)m.push(['warn',t('noWall')]);
      msg($('sizeMsg'),m);
    }else msg($('sizeMsg'),[]);

    var od=num('od'),wall=num('wall'),peak=num('peak'),cap=CALC.MODELS[$('model').value];
    msg($('capMsg'),peak>0&&cap?[peak>cap?['bad',t('capOver',{p:peak,c:cap})]:['ok',t('capOk',{c:cap})]]:[]);

    var fm=null;
    if(od>0&&wall>0&&od>2*wall){
      fm=CALC.flowmeter({mat:mat,od:od,wall:wall,peak:peak},t);
      $('pipeInfo').innerHTML='<span>'+esc(t('idTxt'))+' <b>'+CALC.r1(fm.id)+' mm</b></span><span>'+esc(t('perMs'))+' <b>'+Math.round(fm.perMs)+' L/min</b></span>'+(peak>0?'<span>'+esc(t('velPeak'))+' <b>'+(peak/fm.perMs).toFixed(2)+' m/s</b></span>':'');
      $('fmRows').innerHTML=rowsHtml(fm.rows);
      var ct=CALC.controller(peak,fm.fs,t);
      $('ctRows').innerHTML=rowsHtml(ct.rows);
      $('tfrSet').placeholder=ct.start||'';
    }else{
      $('pipeInfo').innerHTML='';
      $('fmRows').innerHTML='<tr><td colspan="3" class="muted">'+esc(t('needPipe'))+'</td></tr>';
      $('ctRows').innerHTML='<tr><td colspan="3" class="muted">'+esc(t('needPipe2'))+'</td></tr>';
    }
    msg($('sigMsg'),CALC.signal(num('up'),num('dn'),num('q'),num('m91'),t));
    var tm=[];
    if(fm){var tc=CALC.tfrCheck(num('flowNow'),num('tfrNow'),fm.fs.k,t);if(tc)tm.push(tc);}
    var c1=num('ch1'),c2=num('ch2');
    if(c1!=null&&c2!=null&&Math.max(c1,c2)>1&&Math.min(c1,c2)<0.5)tm.push(['warn',t('chDead')]);
    msg($('tfrMsg'),tm);
    var cu=CALC.copper(num('cuBg'),num('cu1'),num('cu2'),num('cuT'),num('tfrSet'),t);
    msg($('cuMsg'),cu?[[cu.cls,cu.text]]:[]);
    $('summary').value=summary(fm,cu);
    save();
  }

  function summary(fm,cu){
    var L=[],sel=function(id){var s=$(id);return s.options[s.selectedIndex].text;};
    L.push('*Cu/Ag commissioning* '+$('site').value);
    L.push('Unit: '+sel('model')+(num('peak')?' | Peak flow: '+num('peak')+' L/min':''));
    if(fm){
      L.push('Pipe: '+sel('mat')+' | OD '+num('od')+' x '+num('wall')+' mm | ID '+CALC.r1(fm.id)+' mm');
      L.push('','*Flowmeter*');
      fm.rows.forEach(function(r){if(r[0]!=='M25'&&r[0]!=='M42')L.push(r[0]+' = '+r[1]);});
      L.push('','*Controller*','Minimum Current = 0.0 A','TFR at Max Flow = '+(num('tfrSet')||'?')+'  (1 pulse = '+fm.fs.k+' L)');
    }
    var ch=[];
    if(num('up')!=null)ch.push('M90 '+num('up')+'/'+(num('dn')!=null?num('dn'):'-')+' Q '+(num('q')!=null?num('q'):'-'));
    if(num('m91')!=null)ch.push('M91 '+num('m91')+'%');
    if(num('flowNow')!=null)ch.push('Flow '+num('flowNow')+' L/min | TFR '+(num('tfrNow')!=null?num('tfrNow'):'-'));
    if(num('ch1')!=null||num('ch2')!=null)ch.push('Ch1 '+(num('ch1')!=null?num('ch1'):'-')+' A | Ch2 '+(num('ch2')!=null?num('ch2'):'-')+' A');
    if(ch.length)L.push.apply(L,['','*Readings*'].concat(ch));
    if(cu&&cu.added!=null){L.push('','*Copper test*','Background '+(num('cuBg')||0)+' | avg '+cu.avg.toFixed(2)+' | added '+cu.added.toFixed(2)+' ppm (target '+num('cuT')+')');if(cu.next)L.push('Next TFR at Max Flow: '+cu.next);}
    return L.join('\n');
  }

  FIELDS.forEach(function(f){$(f).addEventListener('input',function(){
    if(f==='od')manual.od=$('od').value!=='';
    if(f==='wall')manual.wall=$('wall').value!=='';
    if(f==='circ'||f==='mat'||f==='sch'||f==='pn'||f==='sdr'){manual.od=false;manual.wall=false;}
    render();});});
  $('langBtn').addEventListener('click',function(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem(LKEY,lang);}catch(e){}applyLang();});
  $('copyBtn').addEventListener('click',function(){
    var done=function(){$('toast').textContent=t('copied');setTimeout(function(){$('toast').textContent='';},2000);};
    var fail=function(){$('summary').select();$('toast').textContent=t('copyFallback');};
    try{navigator.clipboard.writeText($('summary').value).then(done,fail);}catch(e){fail();}
  });
  $('resetBtn').addEventListener('click',function(){
    var b=$('resetBtn');
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=t('resetConfirm');setTimeout(function(){b.dataset.armed='';b.textContent=t('reset');},3000);return;}
    FIELDS.forEach(function(f){var el=$(f);if(el.tagName==='SELECT'){var d=el.querySelector('[selected]');el.selectedIndex=d?d.index:0;}else el.value=(f==='cuT'?'0.2':'');});
    manual={od:false,wall:false};b.dataset.armed='';b.textContent=t('reset');render();
  });

  load();applyLang();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
})();
</script>
</body>
</html>
